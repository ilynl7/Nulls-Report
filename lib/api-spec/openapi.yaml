openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Nulls Report production portal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: account
  - name: reports
  - name: notifications
  - name: administration
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/logout:
    post:
      operationId: logoutPortalSession
      tags: [account]
      summary: End the current session
      responses:
        "204":
          description: Signed out
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/methods/{provider}/disconnect:
    post:
      operationId: disconnectAuthMethod
      tags: [account]
      summary: Disconnect a linked authentication method
      description: >
        Removes the provider link from the account. The account itself is
        never deleted. The client warns when this is the only method.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [discord, nulls_connect]
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/discord/start:
    get:
      operationId: discordOauthStart
      tags: [account]
      summary: Start Discord OAuth (browser redirect)
      parameters:
        - name: returnTo
          in: query
          required: false
          schema: { type: string }
      responses:
        "302":
          description: Redirect to Discord
  /me:
    get:
      operationId: getCurrentUser
      tags: [account]
      summary: Get the signed-in portal user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateCurrentUser
      tags: [account]
      summary: Update the signed-in portal user's account details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List reports visible to the signed-in user (community feed or own)
      description: >
        scope=community lists every report whose effective visibility is
        public; scope=mine lists the signed-in user's own reports. Filter by
        game, issue type, category, priority, status, verification or search.
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [community, mine]
        - name: game
          in: query
          required: false
          schema:
            type: string
        - name: issueType
          in: query
          required: false
          schema:
            type: string
            enum: [community, game]
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: priority
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: verification
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReportSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createReport
      tags: [reports]
      summary: Submit a community or private report
      description: >
        The reporter chooses Public (visible to the community) or Private
        (reporter + staff only). Risk-critical reports are automatically
        restricted regardless of the choice. Requires a trusted authentication
        method (Discord or Nulls Connect).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportInput"
      responses:
        "201":
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /reports/{id}:
    get:
      operationId: getReport
      tags: [reports]
      summary: Get a report and its permitted history
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: Report detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateReport
      tags: [reports]
      summary: Update a report as staff
      parameters:
        - $ref: "#/components/parameters/ReportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReportInput"
      responses:
        "200":
          description: Updated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /reports/{id}/visibility:
    post:
      operationId: updateReportVisibility
      tags: [reports]
      summary: Change a report's visibility or hide it from the community (staff)
      description: >
        Staff can flip the original Public/Private setting and/or hide a
        report from the community (with an optional reason). Every change is
        recorded in the audit log; the original visibility is preserved.
      parameters:
        - $ref: "#/components/parameters/ReportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReportVisibilityInput"
      responses:
        "200":
          description: Updated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /reports/{id}/verify:
    post:
      operationId: verifyReport
      tags: [reports]
      summary: Verify or reject a ticket as a moderator
      parameters:
        - $ref: "#/components/parameters/ReportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyReportInput"
      responses:
        "200":
          description: Verified report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /reports/{id}/messages:
    get:
      operationId: listReportMessages
      tags: [reports]
      summary: List permitted ticket messages
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createReportMessage
      tags: [reports]
      summary: Add a permitted ticket reply or internal note
      parameters:
        - $ref: "#/components/parameters/ReportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageInput"
      responses:
        "201":
          description: Message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /reports/{id}/reply-permission:
    post:
      operationId: setReportReplyPermission
      tags: [reports]
      summary: Enable or disable replies from the report owner
      parameters:
        - $ref: "#/components/parameters/ReportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplyPermissionInput"
      responses:
        "200":
          description: Updated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List current user notifications
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark one notification read
      parameters:
        - $ref: "#/components/parameters/NotificationId"
      responses:
        "204":
          description: Notification marked read
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/users:
    get:
      operationId: listPortalUsers
      tags: [administration]
      summary: List portal users for administrators
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: clearPortalUsers
      tags: [administration]
      summary: Clear the entire user database (all accounts, reports, messages, notifications)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClearDatabaseInput"
      responses:
        "200":
          description: Database cleared
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/users/{id}/block:
    patch:
      operationId: updatePortalUserBlock
      tags: [administration]
      summary: Block or unblock a portal user
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockUpdateInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/users/{id}:
    delete:
      operationId: deletePortalUser
      tags: [administration]
      summary: Remove a user and all their data from the portal
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed: { type: number }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/users/{id}/role:
    patch:
      operationId: updatePortalUserRole
      tags: [administration]
      summary: Update a portal user role
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleUpdateInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for a private attachment upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an authorized private attachment
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    ReportId:
      name: id
      in: path
      required: true
      schema:
        type: number
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: number
    NotificationId:
      name: id
      in: path
      required: true
      schema:
        type: number
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Insufficient permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: Service not configured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: string
      required: [error]
    User:
      type: object
      properties:
        id: { type: number }
        tag: { type: ["string", "null"] }
        displayName: { type: string }
        role:
          type: string
          enum: [user, moderator, administrator]
        blocked: { type: boolean }
        nullsConnectId: { type: ["string", "null"] }
        nullsConnectName: { type: ["string", "null"] }
        avatarPath: { type: ["string", "null"] }
        discordId: { type: ["string", "null"] }
        discordUsername: { type: ["string", "null"] }
        preferences:
          type: object
          additionalProperties: true
        authMethods:
          type: array
          items: { $ref: "#/components/schemas/AuthMethod" }
        hasTrustedAuth: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [id, tag, displayName, role, preferences, authMethods, hasTrustedAuth, createdAt]
    AuthMethod:
      type: object
      properties:
        provider: { type: string, enum: [discord, nulls_connect] }
        name: { type: string }
        label: { type: ["string", "null"] }
        linkedAt: { type: string, format: date-time }
      required: [provider, name, label, linkedAt]
    ReportSummary:
      type: object
      properties:
        id: { type: number }
        ticketNumber: { type: string }
        ownerId: { type: number }
        ownerName: { type: string }
        ownerTag: { type: ["string", "null"] }
        anonymous: { type: boolean }
        game: { type: string }
        category: { type: string }
        subtype: { type: string }
        issueType: { type: string, enum: [community, game] }
        title: { type: string }
        status: { type: string }
        verification: { type: string, enum: [unverified, verified, rejected] }
        staffStage: { type: string, enum: [moderator_review, administrator_review, resolution] }
        visibility: { type: string, enum: [public, private] }
        effectiveVisibility: { type: string, enum: [public, private, hidden, restricted] }
        hidden: { type: boolean }
        hiddenReason: { type: ["string", "null"] }
        verifiedByName: { type: ["string", "null"] }
        verifiedAt: { type: ["string", "null"], format: date-time }
        priority: { type: string, enum: [normal, high, critical] }
        allowUserMessages: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, ticketNumber, ownerId, ownerName, ownerTag, anonymous, game, category, subtype, issueType, title, status, verification, staffStage, visibility, effectiveVisibility, hidden, verifiedByName, verifiedAt, priority, allowUserMessages, createdAt, updatedAt]
    ReportDetail:
      allOf:
        - $ref: "#/components/schemas/ReportSummary"
        - type: object
          properties:
            details: { type: string }
            fields:
              type: object
              additionalProperties: true
            verifiedByName: { type: ["string", "null"] }
            verifiedAt: { type: ["string", "null"], format: date-time }
            hiddenByName: { type: ["string", "null"] }
            hiddenAt: { type: ["string", "null"], format: date-time }
            history:
              type: array
              items: { $ref: "#/components/schemas/HistoryItem" }
            attachments:
              type: array
              items: { $ref: "#/components/schemas/Attachment" }
          required: [details, fields, verifiedByName, verifiedAt, hiddenByName, hiddenAt, history, attachments]
    HistoryItem:
      type: object
      properties:
        id: { type: number }
        action: { type: string }
        fromStatus: { type: ["string", "null"] }
        toStatus: { type: ["string", "null"] }
        fromVerification: { type: ["string", "null"] }
        toVerification: { type: ["string", "null"] }
        fromValue: { type: ["string", "null"] }
        toValue: { type: ["string", "null"] }
        actorRole: { type: ["string", "null"] }
        details: { type: ["string", "null"] }
        actorName: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, action, createdAt]
    Message:
      type: object
      properties:
        id: { type: number }
        reportId: { type: number }
        authorId: { type: number }
        authorName: { type: string }
        authorRole: { type: ["string", "null"] }
        body: { type: string }
        isInternal: { type: boolean }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }
        createdAt: { type: string, format: date-time }
      required: [id, reportId, authorId, authorName, body, isInternal, attachments, createdAt]
    Attachment:
      type: object
      properties:
        id: { type: number }
        fileName: { type: string }
        contentType: { type: string }
        size: { type: number }
        downloadPath: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, fileName, contentType, size, downloadPath, createdAt]
    Notification:
      type: object
      properties:
        id: { type: number }
        reportId: { type: ["number", "null"] }
        type: { type: string }
        title: { type: string }
        body: { type: string }
        readAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
      required: [id, type, title, body, createdAt]
    CreateReportInput:
      type: object
      properties:
        game: { type: string, enum: [nulls-brawl, nulls-clash-of-clans, nulls-royale, nulls-royale-infinity] }
        issueType: { type: string, enum: [community, game] }
        category: { type: string, minLength: 1, maxLength: 80 }
        subtype: { type: string, minLength: 1, maxLength: 80 }
        title: { type: string, minLength: 3, maxLength: 160 }
        details: { type: string, minLength: 10, maxLength: 10000 }
        fields:
          type: object
          additionalProperties: true
        anonymous: { type: boolean }
        visibility: { type: string, enum: [public, private], default: public }
        priority: { type: string, enum: [normal, high, critical], default: normal }
        attachmentIds:
          type: array
          items: { type: number }
      required: [game, category, subtype, title, details, anonymous]
    UpdateReportInput:
      type: object
      properties:
        title: { type: string, minLength: 3, maxLength: 160 }
        status: { type: string, enum: [open, under_review, awaiting_admin, in_progress, waiting_for_user, resolved, closed] }
        priority: { type: string, enum: [normal, high, critical] }
        details: { type: string, minLength: 10, maxLength: 10000 }
    UpdateReportVisibilityInput:
      type: object
      properties:
        visibility: { type: string, enum: [public, private] }
        hidden: { type: boolean }
        reason: { type: string, maxLength: 500 }
      description: At least one of visibility/hidden is required.
    VerifyReportInput:
      type: object
      properties:
        verified: { type: boolean }
        reason: { type: string, maxLength: 2000 }
      required: [verified]
    CreateMessageInput:
      type: object
      properties:
        body: { type: string, minLength: 1, maxLength: 10000 }
        isInternal: { type: boolean }
        dedupeKey: { type: string, maxLength: 80 }
        attachmentIds:
          type: array
          maxItems: 10
          items: { type: number }
      required: [body]
    ReplyPermissionInput:
      type: object
      properties:
        enabled: { type: boolean }
      required: [enabled]
    RoleUpdateInput:
      type: object
      properties:
        role:
          type: string
          enum: [user, moderator, administrator]
      required: [role]
    BlockUpdateInput:
      type: object
      properties:
        blocked: { type: boolean }
      required: [blocked]
    ClearDatabaseInput:
      type: object
      properties:
        confirm: { type: boolean }
      required: [confirm]
    UploadUrlRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        size: { type: number, minimum: 1, maximum: 52428800 }
        contentType: { type: string, minLength: 1, maxLength: 255 }
      required: [name, size, contentType]
    UploadUrlResponse:
      type: object
      properties:
        id: { type: number }
        uploadURL: { type: string }
        objectPath: { type: string }
      required: [id, uploadURL, objectPath]
    UpdateUserInput:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        preferences:
          type: object
          additionalProperties: true
      description: At least one field is required.