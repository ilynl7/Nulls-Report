kind = "web"
previewPath = "/"
title = "Nulls Report"
description = "A polished report management portal for Nulls game communities, helping players submit reports and staff organize, investigate, and resolve issues across supported games."
version = "1.0.0"
id = "artifacts/nulls-report"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18541

[services.development]
run = "pnpm --filter @workspace/nulls-report run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nulls-report", "run", "build" ]
serve = "static"
publicDir = "artifacts/nulls-report/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18541"
BASE_PATH = "/"
