# Nulls Report — Docker edition (docker compose)
#
#   docker compose -f editions/docker/docker-compose.yml up -d --build
#
# Create an `.env` file next to this compose file (or in the repo root) with
# at minimum:
#   DATABASE_URL=postgres://user:pass@host:5432/db?sslmode=require
#   CLERK_SECRET_KEY=sk_test_...
#   CLERK_PUBLISHABLE_KEY=pk_test_...
#
# Optionally add S3_BUCKET/S3_ENDPOINT/S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY
# for durable attachment storage. Without a bucket, attachments are stored
# on the volume mounted at /app/.local-uploads below.

services:
  nulls-report:
    build:
      context: ..
      dockerfile: editions/docker/Dockerfile
    image: nulls-report
    container_name: nulls-report
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    environment:
      PORT: "8080"
    volumes:
      - nulls-uploads:/app/.local-uploads

volumes:
  nulls-uploads:
