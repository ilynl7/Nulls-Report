# Nulls Report — Docker edition (docker compose)
#
#   docker compose up -d --build
#
# Create an `.env` file in this folder with at minimum:
#   DATABASE_URL=postgres://user:pass@host:5432/db?sslmode=require
#
# Optionally add DISCORD_CLIENT_ID/DISCORD_CLIENT_SECRET to enable
# "Continue with Discord", PUBLIC_URL for the canonical public origin, and
# ADMIN_TAG for the general administrator account.

services:
  nulls-report:
    build: .
    image: nulls-report
    container_name: nulls-report
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      PORT: "8080"
    volumes:
      - nulls-uploads:/app/.local-uploads

volumes:
  nulls-uploads:
